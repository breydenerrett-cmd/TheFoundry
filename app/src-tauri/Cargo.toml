[package]
name = "the-foundry"
version = "0.1.0"
edition = "2021"
description = "THE FOUNDRY — Tauri shell for the V-01 visual floor (not built in the sandbox; see app/README.md)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "the_foundry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
